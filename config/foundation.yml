# Product identity and foundation-wide settings.
#
# Loaded in config/application.rb and exposed everywhere as
# Rails.configuration.x.foundation (keys work as strings or symbols).
shared:
  # Display name used in page titles, meta tags, and mail.
  application_name: "Harbor Roast"

  # Absolute URL or asset path for the product logo. Blank renders a
  # plain wordmark instead.
  logo_url: ""

  # Seed color the Material Design 3 token generator will derive light
  # and dark palettes from. Coffee brown; the generator runs on Holodex,
  # so this stays within the committed token palette contract.
  brand_seed_color: "#6F4E37"

  # Fallbacks for pages that do not set their own title/description.
  default_page_title: "Harbor Roast — small-batch coffee"
  default_page_description: "Small-batch roasted coffee, shipped from our roastery. Browse the catalog, build a cart, and check out as a guest."

  # Absolute URL of the default Open Graph / social sharing image.
  # Blank omits the og:image tag.
  default_og_image_url: ""

  # Public social profiles. Empty means no social links are rendered.
  social_links: {}

  # Operator mailboxes surfaced in support links and legal pages.
  support_email: "orders@harborroast.example"
  legal_email: "legal@harborroast.example"

  # Canonical production domain, no scheme. Used for sitemaps and
  # absolute URLs in mail. Placeholder TLD: the operator must set the
  # real roastery domain before a production launch.
  domain: "harborroast.example"

  # Exact storefront feature flag (SPEC M8): only the YAML boolean true
  # enables its routes, navigation, models' entry points, and production
  # readiness requirement. Any other value is disabled.
  storefront_enabled: true

  # M8 deliberately supports digital fulfillment only in the foundation.
  # A physical-goods app must first implement address collection,
  # shipping/tax calculation, and matching legal terms; readiness rejects
  # any unimplemented mode instead of silently shipping. The hosted
  # preview therefore demonstrates the full buy flow through the local
  # test simulator (no card data), and shipping is the documented
  # production step in docs/STOREFRONT.md before going live.
  storefront_fulfillment_mode: "digital"

  # A live production storefront refuses readiness until an operator has
  # completed the commerce-specific legal/identity checklist in
  # docs/STOREFRONT.md and deliberately changes this marker to true.
  storefront_commerce_legal_reviewed: false

  # Exact lowercase HTTPS hosts permitted for browser-rendered external
  # product images. Empty (the safe default) requires Active Storage uploads.
  # The demo catalog uses Unsplash-hosted coffee photos; an operator can
  # replace them with uploaded images at any time.
  storefront_external_image_hosts:
    - "images.unsplash.com"

  # Host capacity ceilings for /healthcheck disk and memory probes (percent used).
  # Probes pass with an informational note when the platform cannot report figures.
  healthcheck_disk_usage_percent_max: 90
  healthcheck_memory_usage_percent_max: 90

  # Native mobile shell (SPEC M14). Association identifiers stay empty until
  # an operator fills them; unconfigured association endpoints return 404.
  # Path-configuration JSON does not embed these values.
  native:
    # Apple Universal Links: "{TeamID}.{bundle.id}" (e.g. ABCDE12345.com.example.app).
    ios_app_id: ""
    # Paths claimed for Universal Links. Default claims the whole site.
    ios_paths:
      - "*"
    # Android App Links package name (applicationId).
    android_package_name: ""
    # SHA-256 cert fingerprints of the signing key(s), colon-separated hex.
    android_sha256_cert_fingerprints: []
